name: Dada
description: >-
  Dada Group (Dada Nexus, NASDAQ: DADA) is a leading Chinese instant retail and
  local on-demand delivery platform, headquartered in Shanghai and founded in 2014.
  It operates an open, crowdsourced delivery network of more than one million rider
  partners serving supermarkets, pharmacies, fresh-food and restaurant merchants
  across thousands of counties and cities, alongside merchant fulfillment products
  such as the Haibo in-store logistics system and the Dada Youjian picking service.
  Now integrated into the JD.com ecosystem, its core delivery brand was rebranded
  to JD Instant Delivery (京东秒送) in May 2024. Dada runs a merchant Open Platform
  (开放平台) for order, delivery-tracking and fulfillment integrations. This profile
  was surfaced as a portfolio company of Hongshan and enriched by the API Evangelist
  pipeline.
